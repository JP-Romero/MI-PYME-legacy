name: Replace main with MI PYME Make project

on:
  push:
    branches: [main]
    paths: [.github/workflows/replace-with-make.yml]

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the MI PYME Make project
        run: |
          rm -rf /tmp/mi-pyme
          mkdir -p /tmp/mi-pyme
          git fetch origin mi-pyme-pos-app-development-b469b
          git archive --format=tar FETCH_HEAD | tar -xf - -C /tmp/mi-pyme
      - name: Replace repository contents
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/mi-pyme/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace project with MI PYME Make app"
          git push --force origin HEAD:main
